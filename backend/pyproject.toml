[tool.poetry]
name = "rag-platform-backend"
version = "0.1.0"
description = "RAG Knowledge Base Platform - Backend"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"

fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }

sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.0"

pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"

python-jose = { version = "^3.3.0", extras = ["cryptography"] }
passlib = { version = "^1.7.0", extras = ["bcrypt"] }

python-multipart = "^0.0.9"

redis = "^5.0.0"

celery = "^5.4.0"

qdrant-client = "^1.10.1"

httpx = "^0.27.0"

rank-bm25 = "^0.2.0"

sentence-transformers = "^3.0.0"

slowapi = "^0.1.9"

loguru = "^0.7.0"

tenacity = "^8.3.0"

pdfplumber = "^0.11.0"
python-docx = "^1.1.0"
markdown = "^3.6.0"

tiktoken = "^0.7.0"
email-validator = "^2.3.0"
prometheus-client = "^0.21.0"

ragas = ">=0.2.0"
datasets = ">=2.14"
pandas = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: integration tests requiring real services (PG, Redis, etc.)",
    "real_rag: RAG pipeline tests with real Ollama + Qdrant",
    "e2e: end-to-end user journey tests",
    "slow: slow tests that take a long time to run",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
