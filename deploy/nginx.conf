worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json image/svg+xml;

    proxy_buffering off;
    proxy_cache off;

    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:80;
    }

    # Task 88: nginx stub_status — 供 nginx-exporter 抓取指标
    # 仅监听容器内部 8080 端口（docker-compose 已映射），不暴露到主入口 80
    server {
        listen 8080;
        server_name localhost;

        location /stub_status {
            stub_status on;
            access_log off;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
        }
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 50M;

        # ===== 安全响应头 =====
        # 隐藏上游（frontend nginx / backend）可能已添加的安全头，统一由入口 nginx 控制，避免重复
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;

        # CSP：限制资源加载来源
        # - default-src 'self'：默认仅允许同源
        # - script-src 'self'：脚本仅同源（无 unsafe-inline/unsafe-eval）
        # - style-src 'self' 'unsafe-inline'：Ant Design / styled-components 需要 inline style（已文档化妥协）
        # - img-src 'self' data: https:：允许 data URI 与任意 https 图片
        # - font-src 'self' data:：字体同源 + data URI
        # - connect-src：覆盖 Tauri webview (https://tauri.localhost, http://tauri.localhost) 与本地后端 (http://localhost:8000, ws://localhost:8000)
        # - frame-ancestors 'none'：等价于 X-Frame-Options: DENY，防止点击劫持
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 ws://localhost:8000 ws://127.0.0.1:8000 https://tauri.localhost http://tauri.localhost; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none';" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;

            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Task 45: 健康端点分离 - liveness + readiness probe
        # /healthz：仅进程存活（不探测依赖），用于容器编排判断是否需重启
        location = /healthz {
            proxy_pass http://backend/healthz;
            access_log off;
        }

        # /readyz：探测 DB/Redis/Qdrant，用于容器编排判断是否路由流量
        location = /readyz {
            proxy_pass http://backend/readyz;
            access_log off;
        }

        location = /docs {
            proxy_pass http://backend/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /redoc {
            proxy_pass http://backend/redoc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/openapi\.json$ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}