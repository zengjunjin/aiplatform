# Task 87: Promtail 配置 — 采集 Docker 容器日志并推送到 Loki
# Promtail 通过读取 /var/lib/docker/containers/*/*-json.log 抓取容器 stdout/stderr
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 采集所有 Docker 容器的 JSON 日志
  - job_name: docker-container-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=rag-platform"]
    relabel_configs:
      # 使用容器名称作为标签（去掉前导 /）
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      # 使用 compose service 名作为 service 标签
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      # 使用 compose project 名作为 project 标签
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
    pipeline_stages:
      # 解析 Docker JSON 日志格式 {"log":"...","stream":"stdout","time":"..."}
      - json:
          expressions:
            stream: stream
            log: log
      # 仅保留日志内容部分
      - output:
          source: log
      # 将 stream (stdout/stderr) 作为标签
      - labels:
          stream:
