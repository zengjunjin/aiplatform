global:
  resolve_timeout: 5m
  # Task 4.2: SMTP 配置（生产环境部署时通过环境变量覆盖 alertmanager.yml 注入）
  # 注意：alertmanager 不支持 ${VAR:default} 语法，必须使用字面值或通过 docker config/scripts 替换
  # 当前验收测试不使用邮件通知，仅使用 webhook receiver
  # smtp_smarthost: 'smtp.your-domain.com:587'
  # smtp_from: 'alertmanager@your-domain.com'
  # smtp_auth_username: 'alertmanager@your-domain.com'
  # smtp_auth_password: 'CHANGE_ME_IN_PRODUCTION'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: 'default'
  routes:
    - matchers:
        - severity = critical
      receiver: 'critical-webhook'
      continue: true
    - matchers:
        - severity = warning
      receiver: 'warning-webhook'

receivers:
  - name: 'default'
    # Task 4.1: webhook 转发到 webhook-receiver 服务
    webhook_configs:
      - url: 'http://alertmanager-webhook-receiver:5001/webhook'
        send_resolved: true

  - name: 'critical-webhook'
    webhook_configs:
      - url: 'http://alertmanager-webhook-receiver:5001/webhook'
        send_resolved: true

  - name: 'warning-webhook'
    webhook_configs:
      - url: 'http://alertmanager-webhook-receiver:5001/webhook'
        send_resolved: true

# Task 89: 抑制规则 — backend down 时抑制 HighErrorRate
inhibit_rules:
  - source_matchers:
      - alertname = BackendDown
    target_matchers:
      - alertname = HighErrorRate
    equal: ['instance']
