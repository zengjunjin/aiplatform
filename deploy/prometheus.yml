global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Task 2: 加载告警规则文件
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'rag-platform-backend'
    metrics_path: '/internal/metrics'
    # 注意：Prometheus 不支持 ${VAR} 变量替换，bearer_token 必须是字面值
    # 测试环境直接写入 token 值（与 .env 中 METRICS_TOKEN 保持一致）
    # 生产环境应通过 entrypoint + envsubst 在容器启动时替换
    bearer_token: 'acceptance-test-metrics-token-2026-xyz-abc-123'
    static_configs:
      - targets: ['backend:8000']

  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Task 2: node-exporter 抓取主机指标（CPU/内存/磁盘）
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Task 88: Flower 抓取 Celery 任务指标（任务队列、worker 状态等）
  - job_name: 'flower'
    static_configs:
      - targets: ['flower:5555']

  # Task 88: nginx-exporter 抓取 nginx stub_status 指标（连接数、请求量等）
  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['nginx-exporter:9113']

  # 注：Ollama 0.3.14 不暴露 /metrics 端点，暂不抓取。
  # 后续可升级 ollama 镜像或部署 ollama-exporter sidecar 补齐 LLM 推理指标。
