# Trivy 配置：文件系统扫描行为控制
# 用于 security.yml workflow 中的 Trivy FS Scan 步骤
# 目的：避免扫描构建产物（target/node_modules/.venv/release）造成的误报与超时

# 跳过目录：这些目录包含构建产物或第三方依赖，由各自的 lock 文件单独扫描
skip-dirs:
  - frontend/src-tauri/target
  - frontend/node_modules
  - backend/.venv
  - backend/.cache
  - release
  - .git
  - .trae
  - .trae-cn
  - storage
  - qdrant_data
  - qdrant_storage

# 跳过文件：临时 CI 产物
skip-files:
  - trivy-results.sarif
  - trivy-sbom.json
  - backend/bandit-results.sarif

# 漏洞扫描配置：仅报告有修复方案的 CRITICAL 漏洞
ignore-unfixed: true
severity: CRITICAL

# 输出格式
format: sarif
output: trivy-results.sarif

# 退出码：发现 CRITICAL 漏洞时返回 1
exit-code: 1
