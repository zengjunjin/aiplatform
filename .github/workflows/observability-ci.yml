name: Observability CI

on:
  push:
    branches: [main, master]
    paths:
      - 'deploy/prometheus/**'
      - 'deploy/alertmanager.yml'
      - 'deploy/grafana/**'
      - 'deploy/docker-compose.yml'
      - 'deploy/prometheus.yml'
      - 'deploy/promtail.yml'
      - '.github/workflows/observability-ci.yml'
  pull_request:
    paths:
      - 'deploy/prometheus/**'
      - 'deploy/alertmanager.yml'
      - 'deploy/grafana/**'
      - 'deploy/docker-compose.yml'
      - 'deploy/prometheus.yml'
      - 'deploy/promtail.yml'
      - '.github/workflows/observability-ci.yml'

jobs:
  prometheus-rules:
    name: Prometheus Rules Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install promtool
        run: |
          sudo apt-get update
          sudo apt-get install -y prometheus
      - name: Check Prometheus rules
        run: promtool check rules deploy/prometheus/alerts.yml
      - name: Check Prometheus config
        # prometheus.yml 中 rule_files 使用容器内路径 /etc/prometheus/alerts.yml
        # CI 环境中需要创建该路径的软链接，使 promtool 能找到规则文件
        run: |
          sudo mkdir -p /etc/prometheus
          sudo cp deploy/prometheus/alerts.yml /etc/prometheus/alerts.yml
          promtool check config deploy/prometheus.yml

  alertmanager-config:
    name: Alertmanager Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Alertmanager config
        # alertmanager.yml 使用 ${VAR:default} 语法引用环境变量
        # amtool check-config 不支持 --config.expand-env（仅 alertmanager 二进制支持）
        # CI 中用 sed 将 ${VAR:default} 替换为 default 值，${VAR} 替换为 placeholder
        # 再用 amtool 验证展开后的配置文件
        run: |
          sed -E 's/\$\{[A-Z_]+:([^}]+)\}/\1/g; s/\$\{[A-Z_]+\}/placeholder/g' \
            deploy/alertmanager.yml > /tmp/alertmanager-ci.yml
          echo "=== Expanded config for CI validation ==="
          cat /tmp/alertmanager-ci.yml
          echo "=== Running amtool check-config ==="
          docker run --rm \
            -v "/tmp/alertmanager-ci.yml:/etc/alertmanager/alertmanager.yml:ro" \
            prom/alertmanager:v0.27.0 \
            amtool check-config /etc/alertmanager/alertmanager.yml

  grafana-dashboards:
    name: Grafana Dashboard JSON Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JSON syntax check
        run: |
          for f in deploy/grafana/dashboards/*.json; do
            echo "JSON syntax check: $f"
            python -c "import json; json.load(open('$f'))" || exit 1
          done

  docker-compose-lint:
    name: Docker Compose Config Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check docker-compose config
        # docker-compose.yml 中使用 ${VAR:?...} 语法强制要求环境变量
        # backend/celery_worker 服务使用 env_file: - .env 引用 .env 文件
        # CI 环境中创建临时 .env 文件并提供所有必填变量的测试值
        run: |
          cd deploy
          # 创建临时 .env 文件（backend/celery_worker 的 env_file 引用）
          cat > .env <<'ENVEOF'
          POSTGRES_PASSWORD=ci-test-password
          GRAFANA_ADMIN_PASSWORD=ci-test-password
          JWT_SECRET=ci-test-secret-key-at-least-32-chars-long
          ENVEOF
          # 提供所有 ${VAR:?...} 必填变量
          GRAFANA_ADMIN_PASSWORD=ci-test-password \
          POSTGRES_PASSWORD=ci-test-password \
          docker compose -f docker-compose.yml config -q
