name: Frontend CI

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        # 使用 Node 20 LTS，与 frontend/Dockerfile 的 node:20-alpine 保持一致
        # Dockerfile 在 Linux + Node 20 下 npm run build 能成功，CI 应与生产环境一致
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run --coverage --reporter=junit --outputFile=junit.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-test-results
          path: |
            frontend/coverage
            frontend/junit.xml
          retention-days: 7

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Frontend Test Results
          path: frontend/junit.xml
          reporter: java-junit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit (fail on critical)
        # Fail CI only on critical vulnerabilities
        # High/moderate/low severity issues are surfaced but do not fail the build
        run: npm audit --omit=dev --audit-level=critical

      - name: Generate SBOM (license-checker)
        run: npx license-checker --production --json > sbom-frontend.json

      - name: License whitelist check (reject GPL-3.0/AGPL-3.0)
        run: |
          if grep -E 'GPL-3\.0|AGPL-3\.0' sbom-frontend.json; then
            echo "::error::Forbidden license detected (GPL-3.0 or AGPL-3.0)"
            exit 1
          fi
          echo "License check passed: no GPL-3.0/AGPL-3.0 licenses found"

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-sbom
          path: frontend/sbom-frontend.json
          retention-days: 30

      - name: TypeScript compile (tsc -b)
        # 拆分为独立 step，便于从 CI 判断是类型检查失败还是打包失败
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npx tsc -b

      - name: Build production bundle (vite build)
        # 增加 Node.js 堆内存至 4GB，避免 vite/esbuild 打包大型依赖时 OOM
        # 失败时打印 dist 目录内容和内存状态，便于诊断
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: |
          set +e
          # 打印工具链版本，便于排查 Node/esbuild 兼容性问题
          echo "=== Toolchain versions ==="
          node --version
          npx esbuild --version
          npx vite --version
          echo "=========================="
          # --logLevel=info 输出详细构建日志，失败时便于定位具体模块
          npx vite build --logLevel=info
          VITE_EXIT=$?
          echo "vite build exit code: $VITE_EXIT"
          if [ $VITE_EXIT -ne 0 ]; then
            echo "=== Memory status ==="
            free -h || true
            echo "=== dist directory ==="
            ls -la dist/ 2>/dev/null || echo "dist/ not found"
            echo "=== dist/assets directory ==="
            ls -la dist/assets/ 2>/dev/null || echo "dist/assets/ not found"
            echo "=== node_modules size ==="
            du -sh node_modules 2>/dev/null || true
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7
