name: Tauri CI

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/src-tauri/**'
      - '.github/workflows/tauri-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'frontend/src-tauri/**'
      - '.github/workflows/tauri-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Security Audit & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-audit
        # --locked 确保复现构建；--force 强制重装避免缓存命中旧版本
        run: cargo install cargo-audit --locked --force

      - name: Security audit
        # cargo audit 发现漏洞时返回非零退出码
        # 设为 continue-on-error: true 让审计失败不阻塞 CI（漏洞会在日志中报告，便于跟踪）
        # 后续可通过 cargo update 或修改 Cargo.lock 修复已知漏洞
        continue-on-error: true
        run: cd frontend/src-tauri && cargo audit --deny warnings

      - name: Build check
        run: cd frontend/src-tauri && cargo check

  tauri-build:
    name: Build Tauri Windows Bundle
    runs-on: windows-latest
    # 仅在 main 分支 push 时执行完整构建（PR 只跑上面的 audit/check）
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (windows)
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Tauri bundle
        working-directory: frontend
        # 未配置 TAURI_SIGNING_PRIVATE_KEY 时跳过 updater 签名，仍可生成 NSIS 安装包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: Upload Tauri bundle artifact
        uses: actions/upload-artifact@v5
        with:
          name: tauri-windows-bundle
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: warn
          retention-days: 14
