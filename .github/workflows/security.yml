name: Security

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/security.yml'
  schedule:
    # Run weekly on Sunday at 02:00 UTC
    - cron: '0 2 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL Analysis (Python + JS)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Use default security-extended queries for deeper analysis
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        # bandit-sarif-formatter: 提供 SARIF 输出格式插件（bandit 1.7+ 默认不含 sarif）
        run: pip install bandit bandit-sarif-formatter

      - name: Run Bandit on app/
        # Uses backend/.bandit config to exclude tests/integration/e2e
        # -lll: only report high-severity issues
        # -ii: only report issues with confidence HIGH
        # Exit non-zero on high-severity findings
        run: bandit -r app -c .bandit -lll -ii -f sarif -o bandit-results.sarif || (echo "Bandit found high-severity issues" && exit 1)

      - name: Upload Bandit SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/bandit-results.sarif
          category: bandit

  trivy:
    name: Trivy FS Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Trivy filesystem scan
        # v0.36.0 (2026-04-22): 最新稳定版，支持 Node.js 24 runtime
        # 旧版 0.28.0 已从 GitHub releases 中移除，导致 CI 失败
        # 使用 .github/trivy.yaml 配置文件排除 target/node_modules/.venv/release 等构建产物
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          config: .github/trivy.yaml

      - name: Upload Trivy SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Generate SBOM (Trivy CycloneDX)
        # SBOM 生成不阻塞 CI（仅用于审计）
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'cyclonedx'
          output: 'trivy-sbom.json'
          skip-dirs: 'frontend/src-tauri/target,frontend/node_modules,backend/.venv,release,.git'

      - name: Upload Trivy SBOM artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-sbom
          path: trivy-sbom.json
          retention-days: 30
