name: Security

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/security.yml'
  schedule:
    # Run weekly on Sunday at 02:00 UTC
    - cron: '0 2 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL Analysis (Python + JS)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript']

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Use default security-extended queries for deeper analysis
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  bandit:
    name: Bandit (Python SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        # bandit-sarif-formatter: 提供 SARIF 输出格式插件（bandit 1.7+ 默认不含 sarif）
        run: pip install bandit bandit-sarif-formatter

      - name: Run Bandit on app/
        # Uses backend/.bandit config to exclude tests/integration/e2e
        # -lll: only report high-severity issues
        # -ii: only report issues with confidence HIGH
        # Exit non-zero on high-severity findings
        run: bandit -r app -c .bandit -lll -ii -f sarif -o bandit-results.sarif || (echo "Bandit found high-severity issues" && exit 1)

      - name: Upload Bandit SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: backend/bandit-results.sarif
          category: bandit

  trivy:
    name: Trivy FS Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Trivy filesystem scan
        # v0.36.0 (2026-04-22): 最新稳定版
        # 注意：v0.36.0 移除了 `config` 输入参数，改用 inline 参数
        # continue-on-error: 发现 CRITICAL 漏洞时不阻塞 CI（漏洞仍通过 SARIF 上传到 Security tab）
        # 让团队先看到报告，再在后续 PR 中修复，而非阻塞所有 CI
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          skip-dirs: 'frontend/src-tauri/target,frontend/node_modules,backend/.venv,backend/.cache,release,.git,.trae,.trae-cn,storage,qdrant_data,qdrant_storage'
          skip-files: 'trivy-results.sarif,trivy-sbom.json,backend/bandit-results.sarif'

      - name: Upload Trivy SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Generate SBOM (Trivy CycloneDX)
        # SBOM 生成不阻塞 CI（仅用于审计）
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'cyclonedx'
          output: 'trivy-sbom.json'
          skip-dirs: 'frontend/src-tauri/target,frontend/node_modules,backend/.venv,release,.git'

      - name: Upload Trivy SBOM artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-sbom
          path: trivy-sbom.json
          retention-days: 30
